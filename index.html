<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=img, initial-scale=1.0">

</head>

<body>
    <center><img src="SMIT Logo.png" alt="">
        <h1>Saylani Online Academy</h1> <form action="success.html" method="get">
        
    </center>

    <center>
        <form action="">
            <table bgcolor="lightgray" width="" cellspacing="10">
                <tr>
                    <th colspan="2" align="center">
                        <h2>Student Registration Form</h2>
                    </th>
                </tr>
                <tr>
                    <td><label>Name:</label></td>
                    <td><input type="text" placeholder="Name"></td>
                </tr>
                <tr>
                    <td><label for="">Father Name:</label></td>
                    <td><input type="text" placeholder="Father Nmae"></td>
                </tr>
                <tr>
                    <td><label>Password:</label></td>
                    <td><input type="text" placeholder="********"></td>
                </tr>

                <tr>
                    <td><label>Address:</label></td>
                    <td><textarea name="" id="" rows="5" cols="21" placeholder="Address"></textarea></td>
                </tr>

                <tr>
                    <td><label for="">Gender:</label></td>
                    <td>
                        <input type="radio" name="Gender">Male
                        <input type="radio" name="Gender">Female
                    </td>
                </tr>
                <tr>
                    <td><label for="">Language: </label></td>
                    <td><input type="checkbox">Urdu
                        <input type="checkbox">English
                        <input type="checkbox">Arabic
                        <input type="checkbox">Chinese
                    </td>
                </tr>
                <tr>
                    <td><Label>DOB:</Label></td>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <td><Label>Email ID:</Label></td>
                    <td><input type="email" placeholder="Email ID"></td>
                </tr>

                <tr>
                    <td><Label>Mobile Number:</Label></td>
                    <td><input type="number" placeholder="Mobile Number"></td>
                </tr>

                <tr>
                    <td><Label>City: </Label></td>
                    <td> <select name="" id="">
                            <option value="Select Your City" disabled selected> Select Your City</option>
                            <option value="City 1">Hyderabad</option>
                            <option value="City 2">Karachi</option>
                            <option value="City 3">Nawabshah</option>
                        </select></td>
                </tr>

                <tr>
                    <td><label for="">Hobbies: </label></td>
                    <td><select name="" id="" multiple size="1">
                            <option value="" disabled>Select Hobbies</option>
                            <option value="">Cricket</option>
                            <option value="">Football</option>
                            <option value="">Hokey</option>
                            <option value="">Tennis</option>
                        </select></td>
                </tr>


                <tr>
                    <td><label for="">Picture Upload:</label></td>
                    <td><input type="file" value="login" accept=".png, .jpg"></td>

                    <td>

                        <button>Upload</button>
                    </td>
                </tr>
                    <tr>
            <td colspan="2"><center>
            <input type="submit"></center></td>
        </tr>
                

            </table>
        </form>
    </center>
</body>

</html>
